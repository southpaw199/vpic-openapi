openapi: "3.0.3"
info:
  title: vPIC Vehicle API (Unofficial)
  version: 0.1.0
  description: |
   This service decodes and retrieves automotive and manufacturer information from the NHTSA Product Information Catalog Vehicle Listing (vPIC).

   **Disclaimer**: This is an unofficial OpenAPI description. It is not affiliated with or endorsed by [NHTSA](https://vpic.nhtsa.dot.gov/api/).

   ## Base URL

   https://vpic.nhtsa.dot.gov/api/vehicles

   ## Key features

   - **VIN decoding**: Decodes one or more VINs and returns corresponding vehicle and manufacturer information.
   - **Makes and models**: Lists the makes for a vehicle type.

   ## Authentication

   No authentication or API key is required.

   ## Response format

   XML is the default format. Add `format=json` to get JSON.

   ## First request

   ```bash
   curl -s 'https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/1HGCM82633A004352?format=json'
   ```

   ## Error handling

   - Bad input, such as an invalid VIN or unknown vehicle type, returns `HTTP 200`. Check `ErrorCode`, `ErrorText` in each result. For makes, `Count: 0` and an empty `Results` mean nothing matched.
   - Missing or wrong path returns a `404` with a `{"message": ...}` body.

   ## Scope

   This specification covers only three of vPIC's operations:

   - `DecodeVinValues`
   - `DecodeVINValuesBatch`
   - `GetMakesForVehicleType`

   For a full list of available operations, see [NHTSA Vehicle API](https://vpic.nhtsa.dot.gov/api/).
  license:
    name: MIT
    url: https://github.com/southpaw199/vpic-openapi/blob/main/LICENSE
servers:
  - url: https://vpic.nhtsa.dot.gov/api/vehicles
security: []
tags:
  - name: VIN decoding
    description: Get vehicle information based on vehicle identification numbers (VINs)
  - name: Makes and models
    description: Get vehicle makes and models
components:
  parameters:
    Format:
      name: format
      in: query
      required: false
      description: Response format. Defaults to `xml`.
      schema:
        type: string
        enum: [json, xml]
        default: xml
  schemas:
    NotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    VinDecodeResponse:
      type: object
      properties:
        Count:
          type: integer
          format: int32
        Message:
          type: string
        SearchCriteria:
          type: string
          nullable: true
        Results:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
    MakesResponse:
      type: object
      properties:
        Count:
          type: integer
          format: int32
        Message:
          type: string
        SearchCriteria:
          type: string
          nullable: true
        Results:
          type: array
          items:
            type: object
            properties:
              MakeId:
                type: integer
              MakeName:
                type: string
              VehicleTypeId:
                type: integer
              VehicleTypeName:
                type: string
  responses:
    NotFoundError:
      description: Resource not found. The `message` exposes the backend hostname.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          examples:
            missingVin:
              summary: Missing VIN from the request
              value: {"message":"No HTTP resource was found that matches the request URI 'https://backend-vpic-api.nhtsa.dot.gov/api/vehicles/DecodeVinValues/?format=json'."}
            invalidPath:
              summary: Malformed path (from a GetModelsForMakeYear test)
              value: {"message":"No HTTP resource was found that matches the request URI 'https://backend-vpic-api.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/honda,2015?format=json'."}

paths:
  /DecodeVinValues/{vin}:
    get:
      tags:
        - VIN decoding
      summary: Decode a VIN
      description: |
       Use to get vehicle information based on a full or partial VIN value. For a partial VIN, use `*` to indicate an unavailable character. The ninth digit is optional. The first three characters are decoded as the manufacturer code (WMI), so an incomplete VIN can still return a `Make`. For example, `12345` decodes to Make "SHERMAN + REILLY" with ErrorCode `6,8,11`.
      operationId: decodeVin
      parameters:
        - name: vin
          in: path
          required: true
          description: Vehicle identification number (VIN) full or partial; use `*` for unknown characters.
          schema:
            type: string
        - name: modelyear
          in: query
          required: false
          description: The vehicle's model year
          schema:
            type: integer
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Indicates results returned successfully, but may contain errors. Check `Count`, `ErrorCode` and `ErrorText` in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VinDecodeResponse'
              examples:
                validVin:
                  summary: Decoding of a valid VIN
                  value: {"Count":1,"Message":"Results returned successfully. NOTE: Any missing decoded values should be interpreted as NHTSA does not have data on the specific variable. Missing value should NOT be interpreted as an indication that a feature or technology is unavailable for a vehicle.","SearchCriteria":"VIN(s): 1HGCM82633A004352","Results":[{"VIN":"1HGCM82633A004352","Make":"HONDA","Model":"Accord","ModelYear":"2003","BodyClass":"Coupe","ErrorCode":"0","ErrorText":"0 - VIN decoded clean. Check Digit (9th position) is correct","AdditionalErrorText":""}]}
                partialVin:
                  summary: Decoding of a part of a valid VIN
                  value: {"Count":1,"Message":"Results returned successfully. NOTE: Any missing decoded values should be interpreted as NHTSA does not have data on the specific variable. Missing value should NOT be interpreted as an indication that a feature or technology is unavailable for a vehicle.","SearchCriteria":"VIN(s): 1HGCM","Results":[{"VIN":"1HGCM","Make":"HONDA","Model":"","ModelYear":"","BodyClass":"","ErrorCode":"6,8,11","ErrorText":"6 - Incomplete VIN; 8 - No detailed data available currently; 11 - Incorrect Model Year - Position 10 does not match valid model year codes (I, O, Q, U, Z, 0). Decoded data may not be accurate.","AdditionalErrorText":""}]}
                invalidVin:
                  summary: Decoding of an invalid VIN
                  value: {"Count":1,"Message":"Results returned successfully. NOTE: Any missing decoded values should be interpreted as NHTSA does not have data on the specific variable. Missing value should NOT be interpreted as an indication that a feature or technology is unavailable for a vehicle.","SearchCriteria":"VIN(s): 12345","Results":[{"VIN":"12345","Make":"SHERMAN + REILLY","Model":"","ModelYear":"","BodyClass":"","ErrorCode":"6,8,11","ErrorText":"6 - Incomplete VIN; 8 - No detailed data available currently; 11 - Incorrect Model Year - Position 10 does not match valid model year codes (I, O, Q, U, Z, 0). Decoded data may not be accurate.","AdditionalErrorText":""}]}
                invalidVinCharacters:
                  summary: Decoding of a VIN with invalid, special characters
                  value: {"Count":1,"Message":"Results returned successfully. NOTE: Any missing decoded values should be interpreted as NHTSA does not have data on the specific variable. Missing value should NOT be interpreted as an indication that a feature or technology is unavailable for a vehicle.","SearchCriteria":"VIN(s): $$$$$","Results":[{"VIN":"$$$$$","Make":"","Model":"","ModelYear":"","BodyClass":"","ErrorCode":"6,7,11,400","ErrorText":"6 - Incomplete VIN; 7 - Manufacturer is not registered with NHTSA for sale or importation in the U.S. for use on U.S roads; Please contact the manufacturer directly for more information; 11 - Incorrect Model Year - Position 10 does not match valid model year codes (I, O, Q, U, Z, 0). Decoded data may not be accurate.; 400 - Invalid Characters Present","AdditionalErrorText":"Invalid character(s): 1:$, 2:$, 3:$, 4:$, 5:$."}]}
            application/xml:
              schema:
                $ref: '#/components/schemas/VinDecodeResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /DecodeVINValuesBatch:
    post:
      tags:
        - VIN decoding
      summary: Decode a batch of VINs
      description: |
       Use to get vehicle information for a batch of up to 50 full or partial VIN values and an optional model year. For a partial VIN, use `*` to indicate an unavailable character. The ninth digit is optional.
      operationId: decodeVinBatch
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - data
              properties:
                format:
                  type: string
                  enum: [json, xml]
                  default: xml
                data:
                  type: string
                  description: Semicolon-separated entries of `VIN` or `VIN,modelyear`. Up to 50 VINs.
            examples:
              twoVins:
                summary: Two VINs with model years
                value:
                  format: json
                  data: 1HGCM82633A004352,2003;5UXWX7C5*BA,2011
      responses:
        '200':
          description: Indicates results returned successfully, but may contain errors. Check `Count` and the `ErrorCode` and `ErrorText` for each VIN in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VinDecodeResponse'
              examples:
                twoVins:
                  summary: Get vehicle information for two VINs from one request
                  value: {"Count":2,"Message":"Results returned successfully. NOTE: Any missing decoded values should be interpreted as NHTSA does not have data on the specific variable. Missing value should NOT be interpreted as an indication that a feature or technology is unavailable for a vehicle.","SearchCriteria":"","Results":[{"VIN":"1HGCM82633A004352","Make":"HONDA","Model":"Accord","ModelYear":"2003","BodyClass":"Coupe","ErrorCode":"0","ErrorText":"0 - VIN decoded clean. Check Digit (9th position) is correct","AdditionalErrorText":""},{"VIN":"5UXWX7C5*BA","Make":"BMW","Model":"X3","ModelYear":"2011","BodyClass":"Sport Utility Vehicle [SUV]/Multipurpose Vehicle [MPV]","ErrorCode":"6","ErrorText":"6 - Incomplete VIN","AdditionalErrorText":""}]}
            application/xml:
              schema:
                $ref: '#/components/schemas/VinDecodeResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /GetMakesForVehicleType/{vehicleType}:
    get:
      tags:
        - Makes and models
      summary: List makes matching a vehicle type
      description: |
       List makes whose vehicle type name contain the value. For example, `moto` matches `Motorcycle`, `car` matches `Passenger Car`. A vehicle type such as `passenger` matches both `Passenger Car` and `Multipurpose Passenger Vehicle (MPV)` and returns the makes for each type. A make that matches several types appears once per type. Filter on `VehicleTypeId` or `VehicleTypeName` to isolate makes.
      operationId: getMakesByVehicleType
      parameters:
        - name: vehicleType
          in: path
          required: true
          description: All or part of a vehicle type name, such as `car`, `truck`, or `passenger`.
          schema:
            type: string
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: |
            Indicates results returned successfully, but `Count: 0` and `Results` are empty if there is no match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MakesResponse'
              examples:
                validVehicleType:
                  summary: Makes for `car` (3 of 195 shown).
                  value: {"Count":195,"Message":"Response returned successfully","SearchCriteria":"Vehicle Type: car","Results":[{"MakeId":440,"MakeName":"ASTON MARTIN","VehicleTypeId":2,"VehicleTypeName":"Passenger Car"},{"MakeId":441,"MakeName":"TESLA","VehicleTypeId":2,"VehicleTypeName":"Passenger Car"},{"MakeId":442,"MakeName":"JAGUAR","VehicleTypeId":2,"VehicleTypeName":"Passenger Car"}]}
                invalidVehicleType:
                  summary: Get makes for an invalid vehicle type
                  value: {"Count":0,"Message":"Response returned successfully","SearchCriteria":"Vehicle Type: cheese","Results":[]}
            application/xml:
              schema:
                $ref: '#/components/schemas/MakesResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
