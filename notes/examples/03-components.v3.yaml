openapi: "3.0.3"
info:
  title: OpenAPI 3.0 Reusable Components Configuration
  description: |
    This is an example of reusable components configuration for OpenAPI 3.0
  version: "1.0.0"

components:                                          # one parent for all four
  schemas:
    ErrorModel:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string

  parameters:
    UserIdParam:
      name: userId
      in: path
      description: ID of the user to fetch
      required: true
      schema:
        type: integer                               # type moves under schema
        format: int64
  responses:
    Standard400Error:
      description: Invalid input / Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'

    Standard404Error:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-KEY
      in: header

paths:
  /users/{userId}:
    get:
      summary: Get user by ID
      description: Returns user based on ID
      operationId: getUsersById
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A single user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Standard400Error'
        '404':
          $ref: '#/components/responses/Standard404Error'
