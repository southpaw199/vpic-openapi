swagger: "2.0"
info:
  title: Swagger 2.0 Content Negotiation Configuration
  description: |
    This is an example of content negotiation configuration for Swagger 2.0
  version: "1.0.0"

consumes:
  - application/json
  - application/xml
produces:
  - application/json
  - application/xml

paths:
  /user:
    put:
      summary: Create or update a user
      description: Create a new user or update an existing user
      parameters:
        - name: user
          in: body
          schema:
            $ref: '#/definitions/User'
      responses:
        '200':
          description: A single user
          schema:
            $ref: '#/definitions/User'
        '400':
          $ref: '#/responses/Standard400Error'
        '404':
          $ref: '#/responses/Standard404Error'

responses:
  Standard400Error:
    description: Invalid input / Bad request
    schema:
      $ref: '#/definitions/ErrorModel'

  Standard404Error:
    description: Resource not found
    schema:
      $ref: '#/definitions/ErrorModel'

definitions:
  ErrorModel:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
  User:                                             # a single schema used for all media types
    type: object
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      email:
        type: string

