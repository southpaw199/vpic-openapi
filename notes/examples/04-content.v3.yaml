openapi: "3.0.3"
info:
  title: OpenAPI 3.0 Content Negotiation Configuration
  description: |
    This is an example of content negotiation for OpenAPI 3.0
  version: "1.0.0"

components:
  schemas:
    ErrorModel:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
    UserBasic:                                     # can have separate schema for media types
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string

  responses:
    Standard400Error:
      description: Bad request or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Standard404Error:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorModel'
paths:
  /user:
    put:
      tags:
        - Users
      summary: Create or update a user
      description: Create a new user or update an existing user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/xml:
            schema:                    # media type-specific schema
              $ref: '#/components/schemas/UserBasic'
      responses:
        '200':
          description: A single user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:                  # media type-specific schema
                $ref: '#/components/schemas/UserBasic'
        '400':
          $ref: '#/components/responses/Standard400Error'
        '404':
          $ref: '#/components/responses/Standard404Error'