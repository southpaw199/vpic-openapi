swagger: "2.0"
info:
  title: Swagger 2.0 Reusable Components Configuration
  description: |
    This is an example of reusable components configuration for Swagger 2.0
  version: "1.0.0"

definitions:
  ErrorModel:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
  User:
    type: object
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      email:
        type: string

parameters:
  UserIdParam:
    name: userId
    in: path
    description: ID of the user to fetch
    required: true
    type: integer                                    # type sits in the parameter
    format: int64

responses:
  Standard400Error:
    description: Invalid input / Bad request
    schema:
      $ref: '#/definitions/ErrorModel'
  Standard404Error:
    description: Resource not found
    schema:
      $ref: '#/definitions/ErrorModel'
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    name: X-API-KEY
    in: header

paths:
  /users/{userId}:
    get:
      summary: Get user by ID
      description: Returns user based on ID
      operationId: getUsersById
      parameters:
        - $ref: '#/parameters/UserIdParam'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A single user
          schema:
            $ref: '#/definitions/User'
        '400':
          $ref: '#/responses/Standard400Error'
        '404':
          $ref: '#/responses/Standard404Error'
